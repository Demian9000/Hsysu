<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>Әлем астаналары</title>
</head>
<body>
  <h1>
    Әлем елдері
  </h1>
  <table class="hado">
    <caption>Елдер, астаналар және валюталар</caption>
    <tr>
      <th>Ел</th>
      <th>Астанасы</th>
      <th>Құрлығы</th>
      <th>Валютасы</th>
    </tr>
    <tr>
      <td>Қазақстан</td>
      <td>Астана</td>
      <td>Азия</td>
      <td>теңге</td>
    </tr>
    <tr>
      <td>Испания</td>
      <td>Мадрид</td>
      <td>Еуропа</td>
      <td>еуро</td>
    </tr>
    <tr>
      <td>Франция</td>
      <td>Париж</td>
      <td>Еуропа</td>
      <td>еуро</td>
    </tr>
    <tr>
      <td>Жапония</td>
      <td>Токио</td>
      <td>Азия</td>
      <td>иена</td>
    </tr>
    <tr>
      <td>Бразилия</td>
      <td>Бразилиа</td>
      <td>Оңтүстік Америка</td>
      <td>реал</td>
    </tr>
    <tr>
      <td>Египет</td>
      <td>Каир</td>
      <td>Африка</td>
      <td>египет фунты</td>
    </tr>
  </table>
</body>
<style>
body{
  font-family:sans-serif;
}
caption{
  font-size: 22px;
  font-weight: bold;
}
.hado{
  width:70%;
  border-collapse: collapse;
}
.hado th{
  border-bottom: 4px double darkgreen;
  color: darkgreen;
  text-align: left;
  padding:12px
}
.hado td{
  border-bottom: 1px dashed gray;
  padding:12px;
}
.hado tr:hover{
  background-color: darkgreen;
  color: white;
}
</style>
</html>
